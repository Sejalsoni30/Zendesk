services:
  # 1. Backend Web Service (Node.js Express + Socket.io)
  - type: web
    name: zendesk-automation-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_SERVICES
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      - key: ZENDESK_WEBHOOK_SECRET
        value: "demo_webhook_signing_secret_key_883399"

  # 2. Frontend React Vite Static Site
  - type: web
    name: zendesk-automation-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: zendesk-automation-backend
          property: host
